[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deoptscope"
version = "0.1.0"
description = "Census of CPython 3.12 adaptive specialisation, plus a falsification of the fresh-code counterfactual"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "linluozi" }]
dependencies = []

[project.optional-dependencies]
experiments = ["jinja2", "markdown-it-py", "click"]

[project.scripts]
deoptscope = "deoptscope.cli:main"

[tool.setuptools]
packages = ["deoptscope"]
